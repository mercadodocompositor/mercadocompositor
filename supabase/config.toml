[auth]
site_url = "https://mercadodocompositor.com.br/"
additional_redirect_urls = [
  "http://localhost:3000/autenticacao",
  "http://localhost:3000/autenticacao?confirmado=1",
  "http://localhost:3000/autenticacao?modo=new-password",
  "http://localhost:3000/autenticacao?oauth=google",
  "https://mercadodocompositor.com.br/autenticacao",
  "https://mercadodocompositor.com.br/autenticacao?confirmado=1",
  "https://mercadodocompositor.com.br/autenticacao?modo=new-password",
  "https://mercadodocompositor.com.br/autenticacao?oauth=google"
]

[auth.email]
enable_confirmations = true
double_confirm_changes = true
max_frequency = "1m0s"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.rate_limit]
email_sent = 30

[functions.send-auth-email]
verify_jwt = false

[functions.process-notification-emails]
verify_jwt = false

[functions.validate-media-upload]
verify_jwt = true

# O Mercado Pago chama o webhook sem JWT. Sem esta linha o gateway do Supabase
# aplica o padrao verify_jwt = true e recusa toda notificacao com HTTP 401 --
# nenhum pagamento seria processado. A autenticidade do evento e garantida
# dentro da funcao: assinatura HMAC (x-signature) quando
# MERCADOPAGO_WEBHOOK_SECRET esta configurado, mais releitura obrigatoria do
# pagamento na API oficial do Mercado Pago.
[functions.mercadopago-webhook]
verify_jwt = false

# Chamado pelo proprio app com a sessao do compositor.
[functions.mercadopago-checkout]
verify_jwt = true
