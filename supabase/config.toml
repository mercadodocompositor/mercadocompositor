[auth]
site_url = "https://mercadodocompositor.com.br/"
additional_redirect_urls = [
  "http://localhost:3000/autenticacao",
  "https://mercadodocompositor.com.br/autenticacao"
]

[auth.email]
enable_confirmations = true
double_confirm_changes = true
max_frequency = "1m0s"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.send-auth-email]
verify_jwt = false
